name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull request rules
        if: github.event_name == 'pull_request'
        run: node scripts/check.mjs --base ${{ github.event.pull_request.base.sha }}
      - name: Repository
        if: github.event_name == 'push'
        run: node scripts/check.mjs
